name = "playstorewizard-pro"
main = ".open-next/worker.js"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = true

routes = [
  { pattern = "playstorewizard.pro/*", zone_name = "playstorewizard.pro" },
  { pattern = "*.playstorewizard.pro/*", zone_name = "playstorewizard.pro" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "USER_SITES"
id = "2d3f19cd03224025a726d5dd75283c80"

[[kv_namespaces]]
binding = "SITE_EVENTS"
id = "6adcafb024ad410dabc054c5cc7618bd"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "playstorewizard-pro"

[vars]
NEXT_PUBLIC_SITE_URL = "https://playstorewizard.pro"
NEXT_PUBLIC_ADSENSE_CLIENT_ID = "ca-pub-5800977493749262"
PAYPAL_ENV = "live"

# Required production secrets, set with Wrangler or Cloudflare dashboard:
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# PAYPAL_CLIENT_ID
# PAYPAL_CLIENT_SECRET
# LICENSE_SIGNING_SECRET
# ADMIN_ACCESS_TOKEN
#
# Optional AdSense ad-unit slot IDs (set as [vars] once real units exist in the
# AdSense dashboard; until then ad units render nothing in production):
# NEXT_PUBLIC_AD_SLOT_HOME
# NEXT_PUBLIC_AD_SLOT_FEED
# NEXT_PUBLIC_AD_SLOT_ARTICLE
# NEXT_PUBLIC_AD_SLOT_FEATURES
# NEXT_PUBLIC_AD_SLOT_FAQ
#
# Optional:
# STRIPE_PRICE_PRO_MONTHLY
# STRIPE_PRICE_PRO_YEARLY
# STRIPE_PRICE_PRO_LIFETIME
# STRIPE_PRICE_STUDIO_MONTHLY
# STRIPE_PRICE_STUDIO_YEARLY
# STRIPE_PRICE_STUDIO_LIFETIME
# GOOGLE_SA_JSON
