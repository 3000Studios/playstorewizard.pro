name = "playstorewizard-pro"
main = ".open-next/worker.js"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = true

routes = [
  { pattern = "playstorewizard.pro/*", zone_name = "playstorewizard.pro" },
  { pattern = "*.playstorewizard.pro/*", zone_name = "playstorewizard.pro" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "USER_SITES"
id = "2d3f19cd03224025a726d5dd75283c80"

[[kv_namespaces]]
binding = "SITE_EVENTS"
id = "6adcafb024ad410dabc054c5cc7618bd"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "playstorewizard-pro"

[vars]
NEXT_PUBLIC_SITE_URL              = "https://playstorewizard.pro"
NEXT_PUBLIC_ADSENSE_CLIENT_ID     = "ca-pub-5800977493749262"
PAYPAL_ENV                        = "live"
NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY = "pk_live_51SCLtrGejm3JMan4oTgv5MvjcAIPr1AWhkUamJiUufyqhWkeiq2iZ8GVQBy56xewUSiyLxPp05gPy4KBrZDsvG8e00uM2g1yCd"
# Firebase Web SDK (client-safe — these are not secrets, they are project identifiers)
NEXT_PUBLIC_FIREBASE_API_KEY          = "AIzaSyC2VCBOszos800f-m8inp7XhJkLH4KFkKs"
NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN      = "gen-lang-client-0914367944.firebaseapp.com"
NEXT_PUBLIC_FIREBASE_PROJECT_ID       = "gen-lang-client-0914367944"
NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET   = "gen-lang-client-0914367944.firebasestorage.app"
NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = "76706851259"
NEXT_PUBLIC_FIREBASE_APP_ID           = "1:76706851259:web:bc534d20b8152cd7d93c9e"
NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID   = "G-DH1WBK8YWK"
# License verify key — intentionally public (HMAC; client-side gating only;
# server-side paid API routes re-verify against webhook records).
# Set to same value as LICENSE_SIGNING_SECRET secret via Cloudflare dashboard.
NEXT_PUBLIC_LICENSE_VERIFY_KEY        = ""

